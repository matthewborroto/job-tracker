{% extends "base.html" %}
{% block title %}{{ action }} Company{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ action }} Company</h1>
</div>

<form method="post" class="card form">
    <div class="form-grid">
        <label class="span-2">Company name <span class="req">*</span>
            <input type="text" name="company_name" value="{{ company.company_name or '' }}" required maxlength="100">
        </label>
        <label>Industry
            <input type="text" name="industry" value="{{ company.industry or '' }}" maxlength="50" placeholder="Technology, Finance…">
        </label>
        <label>Website
            <input type="url" name="website" value="{{ company.website or '' }}" maxlength="200" placeholder="https://">
        </label>
        <label>City
            <input type="text" name="city" value="{{ company.city or '' }}" maxlength="50">
        </label>
        <label>State
            <input type="text" name="state" value="{{ company.state or '' }}" maxlength="50">
        </label>
        <label class="span-2">Notes
            <textarea name="notes" rows="4">{{ company.notes or '' }}</textarea>
        </label>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{ 'Save Changes' if action == 'Edit' else 'Add Company' }}</button>
        <a class="btn" href="{{ url_for('company_detail', company_id=company.company_id) if company.company_id else url_for('companies') }}">Cancel</a>
    </div>
</form>
{% endblock %}
